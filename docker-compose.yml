services:
  db:
    image: postgres:17
    container_name: portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chaberer
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: db_name
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
